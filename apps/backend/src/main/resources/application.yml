spring:
  application:
    name: gamified-study-hub-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  mvc:
    throw-exception-if-no-handler-found: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      # We use Redis only via StringRedisTemplate, not Spring Data repositories —
      # disable repo scanning so it doesn't try to adopt the JPA repositories.
      repositories:
        enabled: false
    mongodb:
      # Connection is lazy: the app boots even when MongoDB is not running.
      # Enable the health probe + real usage via app.integrations.mongodb.enabled.
      uri: ${MONGODB_URI:mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DB:gamified_study_hub}}
      auto-index-creation: true
  elasticsearch:
    # Also lazy — no connection attempt until a repository/template is used.
    uris: ${ELASTICSEARCH_URIS:http://${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    connection-timeout: 2s
    socket-timeout: 5s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:gsh-backend}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.gamifiedstudyhub.backend.*
    listener:
      # Listener containers do NOT start (and thus never dial the broker) unless
      # messaging is explicitly enabled — keeps startup clean with no broker.
      auto-startup: ${APP_KAFKA_ENABLED:false}
      missing-topics-fatal: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

server:
  port: ${BACKEND_PORT:8080}
  # Honour X-Forwarded-* from the trusted Caddy proxy (so HTTPS-only headers
  # like HSTS and Secure-cookie detection work behind TLS termination).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Optional backing stores must not drag readiness DOWN when they are off.
    # Flip these on together with the matching app.integrations.*.enabled flag.
    mongo:
      enabled: ${APP_MONGO_ENABLED:false}
    elasticsearch:
      enabled: ${APP_ES_ENABLED:false}
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # Every meter is tagged with the app + environment for multi-instance dashboards.
      application: ${spring.application.name}
      environment: ${APP_ENV:local}
  tracing:
    # Default 0.0 → no spans are produced or exported, so a missing OTLP collector
    # is a no-op. Set APP_TRACING_SAMPLING=1.0 (dev) to trace everything.
    sampling:
      probability: ${APP_TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

app:
  # Feature flags for optional platform integrations. Default OFF so the current
  # (prod-lean) deployment stays light; flip a flag + point at a running service
  # to activate. See docs/architecture/platform-integrations.md.
  integrations:
    mongodb:
      enabled: ${APP_MONGO_ENABLED:false}
    elasticsearch:
      enabled: ${APP_ES_ENABLED:false}
    kafka:
      enabled: ${APP_KAFKA_ENABLED:false}
  # Optional product features. The `activity` feed is a reference feature that
  # exercises MongoDB + Kafka + Elasticsearch together; enabling it requires those
  # three integrations to be on as well.
  features:
    activity:
      enabled: ${APP_FEATURE_ACTIVITY_ENABLED:false}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
    refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:30}
  cookie:
    domain: ${COOKIE_DOMAIN:}
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAMESITE:Lax}
  mail:
    from: ${MAIL_FROM:no-reply@aquvix.site}
    # Base URL used to build verify/reset links in emails (the public site).
    base-url: ${MAIL_BASE_URL:${FRONTEND_ORIGIN:http://localhost:5173}}
  mfa:
    # Base64-encoded 32-byte key (openssl rand -base64 32) to encrypt TOTP secrets.
    encryption-key: ${MFA_ENCRYPTION_KEY:}
    issuer: ${MFA_ISSUER:Gamified Study Hub}
  security:
    ratelimit:
      ip-per-minute: ${AUTH_RL_IP_PER_MIN:30}
      account-per-window: ${AUTH_RL_ACCOUNT:5}
      account-window-seconds: ${AUTH_RL_ACCOUNT_WINDOW:900}
    lockout:
      max-attempts: ${AUTH_LOCKOUT_MAX_ATTEMPTS:5}
      base-lock-seconds: ${AUTH_LOCKOUT_BASE_SECONDS:60}
      max-tier: ${AUTH_LOCKOUT_MAX_TIER:5}
    email-ratelimit:
      ip-per-minute: ${AUTH_EMAIL_RL_IP_PER_MIN:5}
      per-email-per-hour: ${AUTH_EMAIL_RL_PER_EMAIL:3}
      email-cooldown-seconds: ${AUTH_EMAIL_RL_COOLDOWN:60}
