name: CI

# Validates every pull request into main before it can merge: backend tests
# (JDK 21) and frontend lint + typecheck + build. Deploy stays in deploy.yml
# (push to main only) — this workflow never deploys.

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Tests are self-contained: the context test excludes DataSource/JPA/Flyway
      # and mocks repositories; @DataJpaTest uses in-memory H2. No DB/Redis needed.
      - name: Run tests
        run: mvn -B -ntp -Dnet.bytebuddy.experimental=true test

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` runs `vue-tsc --noEmit` (typecheck) then `vite build`.
      - name: Typecheck & build
        run: npm run build
