# Auto-provisioned Grafana datasources (metrics / logs / traces).
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Jump from a trace to its logs in Loki using the traceId.
      tracesToLogsV2:
        datasourceUid: loki
